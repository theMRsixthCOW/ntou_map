<html lang="en">
<head>
  <title>海大地圖NTOUMAP</title>

  <meta charset='utf-8'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.css' />
  <script src='https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.js'></script>
  <script src="find.js"></script>
  <link href="logo.png" rel="icon" type="image/png">
  <link rel="stylesheet" href="eye_style.css">
  <link rel="stylesheet" href="index.css">

  <style>
      body { margin: 0; padding: 0; }
      html, body, #map { height: 100%; }
  </style>
</head>
<body>
<div id="map"></div>

<div class="search-container inputbar">
  <div id="fname-placeholder-wrapper" class="placeholder-wrapper">
    <div class="marquee-content">
      <span data-i18n="ADM or 行政大樓 or 1（地圖上的編號）"> ADM or 行政大樓 or 1（地圖上的編號） </span>
      <span data-i18n="ADM or 行政大樓 or 1（地圖上的編號）"> ADM or 行政大樓 or 1（地圖上的編號） </span>
    </div>
  </div>
  <input type="search" id="fname" autocomplete="off" oninput="handleSearchInput('fname')" onfocus="handleSearchInput('fname')" onkeypress="if(event.key === 'Enter') { findBuilding(); hideAllSuggestions(); }">
  <button id="fname-clear" class="clear-btn" onclick="clearInput('fname')" style="display: none;"><img src="https://cdn-icons-png.flaticon.com/128/1617/1617543.png" alt="clear"></button>
  <button class="locate-btn" onclick="locateUser()" title="定位我的位置"><img src="icons/target.png" alt="locate me"></button>
  <button onclick="findBuilding(); hideAllSuggestions();"><img src="https://icons.veryicon.com/png/o/miscellaneous/effevo/enter-12.png" alt="search"></button>
  <div id="fname-suggestions" class="suggestions-dropdown"></div>
</div>
<div class="search-container inputbar2">
  <input type="search" id="destination" autocomplete="off" placeholder="目的地（例如：圖書館或教授名字）" data-i18n="目的地（例如：圖書館或教授名字）" oninput="handleSearchInput('destination')" onfocus="handleSearchInput('destination')" onkeypress="if(event.key === 'Enter') { findRoute(); hideAllSuggestions(); }">
  <button id="destination-clear" class="clear-btn" onclick="clearInput('destination')" style="display: none;"><img src="https://cdn-icons-png.flaticon.com/128/1617/1617543.png" alt="clear"></button>
  <button onclick="findRoute(); hideAllSuggestions();"><img src="https://icons.veryicon.com/png/o/miscellaneous/effevo/enter-12.png" alt="search"></button>
  <div id="destination-suggestions" class="suggestions-dropdown"></div>
</div>

<input type="hidden" id="lat-input">
<input type="hidden" id="lng-input">
<input type="hidden" id="lat-destination">
<input type="hidden" id="lng-destination">


<!-- Settings Floating Action Button & Sliding CLI Menu -->
<div id="settings-container" class="settings-container">
  <button id="settings-btn" class="settings-btn" title="設定 / Settings" onclick="toggleSettingsMenu(event)">
    <svg class="settings-gear-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </button>

  <div id="settings-table" class="settings-table">
    <div class="settings-header">
      <span class="settings-title" data-i18n="> SYS.SETTINGS">&gt; SYS.SETTINGS</span>
    </div>
    <div class="settings-body">
      <!-- Language Toggle -->
      <button id="lang-toggle" class="settings-item-btn" onclick="handleLangToggle(event)">
        <span class="terminal-prefix">&gt;</span>
        <span id="lang-toggle-text" data-i18n="切換語言 (EN)">切換語言 (EN)</span>
      </button>

      <!-- Report Error Window Button -->
      <button id="report-window-btn" class="settings-item-btn" onclick="handleReportWindowOpen(event)">
        <span class="terminal-prefix">&gt;</span>
        <span id="report-btn-text" data-i18n="報錯">報錯</span>
      </button>

      <!-- Toggle Dark Mode -->
      <button id="dark-mode-btn" class="settings-item-btn" onclick="handleDarkModeToggle(event)">
        <span class="terminal-prefix">&gt;</span>
        <span id="dark-mode-text" data-i18n="深色模式">深色模式</span>
      </button>
    </div>
  </div>
</div>

<!-- Report / Contact Window -->
<div id="report-window" class="report-window">
  <div id="report-window-header" class="report-window-header">
    <span class="report-window-title" data-i18n="聯絡我們">聯絡我們</span>
    <img src="https://cdn-icons-png.flaticon.com/128/9068/9068699.png" class="report-close-btn" onclick="closeReportWindow()" title="關閉">
  </div>
  <div class="report-window-body">
    <div class="report-eye-container">
      <div class="eye-wrapper">
        <div class="eye-ball"></div>
      </div>
    </div>
    <div class="report-window-text">
      <p id="reporttext001" class="report-window-text001" data-i18n="> 有什麼事嗎？">&gt; 有什麼事嗎？</p>
      <p id="reporttext002" class="report-window-text002" data-i18n="> 請選擇類型：">&gt; 請選擇類型：</p>
    </div>
    <!-- Step 1: Topic selection buttons -->
    <div id="report-topic-buttons" class="report-topic-buttons">
      <button class="report-topic-btn" onclick="selectTopic('聯絡我們')" data-i18n="聯絡我們">聯絡我們</button>
      <button class="report-topic-btn" onclick="selectTopic('回報錯誤or建議')" data-i18n="回報錯誤 / 建議">回報錯誤 / 建議</button>
      <button class="report-topic-btn" onclick="selectTopic('我想要改造建築物')" data-i18n="我想改造建築物">我想改造建築物</button>
    </div>
    <!-- Step 2: Message input (hidden until topic is chosen) -->
    <div id="report-input-area" class="report-input-area" style="display:none;">
      <textarea id="report-message" class="report-textarea" placeholder="在這裡輸入你的訊息..." data-i18n="在這裡輸入你的訊息..."></textarea>
      <div class="report-actions">
        <button class="report-back-btn" onclick="resetReport()" data-i18n="← 返回">← 返回</button>
        <button class="report-send-btn" onclick="submitReport()" data-i18n="送出 ">送出 </button>
      </div>
    </div>
  </div>
</div>

<script src="eye_window.js"></script>
<script src="Weather.js"></script>
</body>
</html>
